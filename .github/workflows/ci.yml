name: CI
on:
  push:
  pull_request:
jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,desktop]"
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm NetworkWeather.spec
      - run: python scripts/smoke_bundle.py
      - name: Upload Windows development preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: NetworkWeather-Windows-${{ github.sha }}
          path: dist/NetworkWeather/
          if-no-files-found: error
          retention-days: 30
